<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Celery app icon: plump strawberry silhouette on a deep blue tile,
       in the same soft single-glyph language as shigomori's tree
       (rounded lobes, one off-white fill, no interior detail). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b62ad"/>
      <stop offset="1" stop-color="#12294f"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g fill="#f5f5f2">
    <!-- leaf lobes: plain ovals, like the tree's circle lobes -->
    <ellipse cx="512" cy="300" rx="56" ry="116"/>
    <ellipse cx="410" cy="340" rx="52" ry="100" transform="rotate(-48 410 340)"/>
    <ellipse cx="614" cy="340" rx="52" ry="100" transform="rotate(48 614 340)"/>
    <!-- berry: rounded, gently tapered -->
    <path d="M 512 828
             C 394 766, 314 652, 314 528
             C 314 416, 404 344, 512 344
             C 620 344, 710 416, 710 528
             C 710 652, 630 766, 512 828 Z"/>
  </g>
</svg>
