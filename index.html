<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celery</title>
    <script>
      // Apply persisted theme synchronously before any CSS or React runs,
      // so the first paint matches the user's choice. The window itself is
      // transparent (vibrancy sidebar); the opaque background is painted
      // by the main pane only.
      (function () {
        try {
          // Key must match THEME_STORAGE_KEY in renderer/hooks/useTheme.tsx.
          var stored = localStorage.getItem("celery.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var html = document.documentElement;
          if (dark) html.classList.add("dark");
          html.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {
          // localStorage may be unavailable in some contexts; render light.
        }
      })();
    </script>
    <script type="module">
      // react-grab: ⌘C / Ctrl+C on a hovered element copies its source
      // location (file + component) for pasting into an AI coding agent.
      // Dev-only: Vite tree-shakes this out of packaged builds.
      if (import.meta.env.DEV) {
        import("react-grab");
      }
    </script>
  </head>
  <body>
    <!-- The sky the app sits under: drifting aurora over two star
         fields. Decoration with no hit area and nothing to configure,
         so it lives in the shell rather than in the React tree. Styled
         and explained in renderer/index.css. -->
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere-aurora"></div>
      <div class="atmosphere-stars"></div>
      <div class="atmosphere-stars atmosphere-stars-far"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/renderer/index.tsx"></script>
  </body>
</html>
